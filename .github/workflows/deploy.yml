name: Deploy to Beget

# Основная выкладка: push в main → сайт уезжает на подноль.рф по FTP.
# Требует секретов PODNOL_FTP_SERVER / PODNOL_FTP_USERNAME / PODNOL_FTP_PASSWORD / PODNOL_FTP_DIR
# пока они не заданы — шаг деплоя просто пропускается (сайт живёт на Pages).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-beget
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Проверить, что секреты FTP заданы
        id: gate
        env:
          FTP_SERVER: ${{ secrets.PODNOL_FTP_SERVER }}
        run: |
          if [ -z "$FTP_SERVER" ]; then
            echo "::warning::секрет PODNOL_FTP_SERVER не задан — выкладка на Beget пропущена"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Забрать код
        if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Проверить, что ключевые файлы на месте
        if: steps.gate.outputs.ready == 'true'
        run: |
          for f in index.html 404.html privacy.html consent.html .htaccess robots.txt sitemap.xml \
                   css/style.css js/main.js favicon.svg api/lead.php \
                   assets/img/hero.jpg assets/fonts/montserrat-latin.woff2 assets/fonts/montserrat-cyrillic.woff2; do
            [ -f "$f" ] || { echo "::error::нет файла $f — выкладка остановлена"; exit 1; }
          done
          echo "все ключевые файлы на месте"

      # Токен бота и id чата не хранятся в репозитории: конфиг обработчика
      # заявок собирается здесь из секретов и уезжает на хостинг вместе с сайтом.
      # Пока секретов нет — форма работает через запасной путь WhatsApp.
      # Бот — свой у подноль.рф («Под Ноль»), группа общая с voidaform.ru.
      # FUTUREFLOW_OWNER_CHAT_ID — личка владельца: туда уходят сообщения о сбоях.
      - name: Собрать конфиг Telegram-бота
        id: cfg
        if: steps.gate.outputs.ready == 'true'
        env:
          TG_BOT_TOKEN: ${{ secrets.PODNOL_TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.PODNOL_TG_CHAT_ID }}
          TG_OWNER_CHAT_ID: ${{ secrets.FUTUREFLOW_OWNER_CHAT_ID }}
          AVITO_CLIENT_ID: ${{ secrets.PODNOL_AVITO_CLIENT_ID }}
          AVITO_CLIENT_SECRET: ${{ secrets.PODNOL_AVITO_CLIENT_SECRET }}
        run: |
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "::warning::секреты PODNOL_TG_BOT_TOKEN / PODNOL_TG_CHAT_ID не заданы — заявки пойдут в WhatsApp"
            exit 0
          fi
          mkdir -p api
          {
            echo "<?php"
            echo "// файл собирается автоматически при выкладке, руками не править"
            echo "return ["
            echo "    'token' => '${TG_BOT_TOKEN}',"
            echo "    'chat_id' => '${TG_CHAT_ID}',"
            echo "    'owner_chat_id' => '${TG_OWNER_CHAT_ID}',"
            echo "    'site' => 'подноль.рф',"
            echo "    'origins' => ['https://xn--d1aofccc0h.xn--p1ai'],"
            echo "    'avito_client_id' => '${AVITO_CLIENT_ID}',"
            echo "    'avito_client_secret' => '${AVITO_CLIENT_SECRET}',"
            echo "];"
          } > api/config.php
          if [ -z "$AVITO_CLIENT_ID" ] || [ -z "$AVITO_CLIENT_SECRET" ]; then
            echo "::warning::секреты PODNOL_AVITO_CLIENT_ID / PODNOL_AVITO_CLIENT_SECRET не заданы — мост Авито→Telegram молчит"
          fi
          [ -n "$TG_OWNER_CHAT_ID" ] || echo "::warning::секрет FUTUREFLOW_OWNER_CHAT_ID не задан — о сбоях никто не узнает"
          echo "built=true" >> "$GITHUB_OUTPUT"
          echo "конфиг создан"

      - name: Залить на хостинг по FTP
        if: steps.gate.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.PODNOL_FTP_SERVER }}
          username: ${{ secrets.PODNOL_FTP_USERNAME }}
          password: ${{ secrets.PODNOL_FTP_PASSWORD }}
          server-dir: ${{ secrets.PODNOL_FTP_DIR }}
          protocol: ftp
          # в репозитории лежат и служебные файлы — на хостинг они не нужны
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            scripts/**
            CLAUDE.md
            **/.DS_Store

      # Сайт залит — убеждаемся, что обработчики живые: lead.php выдаёт токен
      # формы (значит, конфиг на месте и PHP не падает), avito.php без ключа
      # отвечает 404 (а не 500 «не настроен»).
      - name: Проверить обработчики на живом сайте
        if: steps.cfg.outputs.built == 'true'
        run: bash scripts/check_live.sh

      - name: Сообщить владельцу, что выкладка упала
        if: failure()
        env:
          TG_BOT_TOKEN: ${{ secrets.PODNOL_TG_BOT_TOKEN }}
          TG_OWNER_CHAT_ID: ${{ secrets.FUTUREFLOW_OWNER_CHAT_ID }}
        run: |
          [ -n "$TG_BOT_TOKEN" ] && [ -n "$TG_OWNER_CHAT_ID" ] || exit 0
          curl -sS -m 20 "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            --data-urlencode chat_id="$TG_OWNER_CHAT_ID" \
            --data-urlencode text="⚠️ подноль.рф: выкладка упала — ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > /dev/null
